<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>enfermeRed - Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/componentes.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
 <div id="header-component"></div>
    <main class="login-main">

        <section class="login-section">
            <div class="login-card">
                <div class="login-header">
                    <h1 class="login-titulo">Iniciar sesión</h1>
                </div>

                <form id="form-login" novalidate>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="username" required>
                        <span class="mensaje-error" id="error-email"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <span class="mensaje-error" id="error-password"></span>
                    </div>

                    <span class="mensaje-error" id="error-login"></span>

                    <div class="login-acciones">
                        <div class="login-buttons">
                            <button type="submit" class="btn-ingresar">Ingresar</button>
                            <div class="register-group">
                                <p class="login-no-cuenta">¿No tenés cuenta?</p>
                                <button type="button" class="btn-registrarse" onclick="window.location.href='/vistas/register.html'">Registrarse</button>
                            </div>
                        </div>
                        <div class="login-info">
                            <p class="login-recuperar">¿Olvidaste tu contraseña? <a href="#" class="btn-recuperar">recuperala aquí</a></p>
                        </div>
                    </div>

                    
                </form>
            </div>
        </section>
    </main>
<div id="footer-component"></div>
<script src="/js/cargaFragmentos.js"></script>
<script src="/js/usuarios.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
